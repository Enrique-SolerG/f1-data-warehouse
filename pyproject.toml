[project]
name = "f1-data-warehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "open-f1-client",
]

[tool.uv.workspace]
members = ["open-f1-client"]

[tool.uv.sources]
open-f1-client = { workspace = true }

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "commitizen>=4.19.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["open-f1-client/tests"]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
update_changelog_on_bump = true
major_version_zero = true
